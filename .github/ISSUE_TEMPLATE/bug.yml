name: Kernel bug
description: Report a correctness, build, crash, or NaN issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: GPU and software matrix
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication safety
      options:
        - label: No credentials, model/checkpoint files, generated binaries, or private data are attached.
          required: true
