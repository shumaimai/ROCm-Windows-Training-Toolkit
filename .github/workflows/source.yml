name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q rocm_windows_training tests
      - name: Validate required files
        shell: pwsh
        run: |
          foreach ($path in @('LICENSE','NOTICE','THIRD_PARTY.md','extensions/rocm_windows_kernels.cpp','extensions/rocm_windows_kernels.cu')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
          }
      - name: Parse PowerShell
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$null,[ref]$errors)
            if ($errors.Count) { throw "$($script.Name): $errors" }
          }
      - name: Publication safety
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = @($tracked | Where-Object {
            $_ -like 'artifacts/*' -or $_ -match '\.(pyd|dll|lib|exp|obj|o|pt|bin|safetensors)$'
          })
          if ($bad.Count) { throw "Generated or third-party binary tracked: $bad" }
