name: rocm-windows-training-wsl2

services:
  validate:
    build:
      context: ..
      dockerfile: docker/wsl2/Dockerfile
      args:
        GPU_ARCH: ${GPU_ARCH:-gfx1101}
        ROCM_VERSION: ${ROCM_VERSION:-7.14.0}
        TORCH_VERSION: ${TORCH_VERSION:-2.12.0+rocm7.14.0}
        ROCDXG_VERSION: ${ROCDXG_VERSION:-1.2.2}
    image: rocm-windows-training-wsl2:${GPU_ARCH:-gfx1101}
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8gb
    environment:
      HSA_ENABLE_DXG_DETECTION: "1"
    command: ["validate"]
